<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HapticNav — Selección de rol</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
</head>

<body>

<div class="home-container">

  <div class="home-box">

    <div class="logo-mark">
      🧭
    </div>

    <div class="home-title">
      HAPTICNAV
    </div>

    <div class="home-sub">
      Selecciona tu rol en el sistema
    </div>

    <div class="role-buttons">

      <button class="role-btn" onclick="goNavigator()">
        📍 Usuario principal
      </button>

      <button class="role-btn" onclick="goCompanion()">
        👁 Acompañante
      </button>

    </div>

  </div>

</div>

<script>
function goNavigator() {
  window.location.href = "/index.html";
}

function goCompanion() {
  window.location.href = "/companion.html";
}
</script>

</body>
</html>
